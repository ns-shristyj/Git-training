bedrock_agentcore:
  agent_name: ciam-response-generator
  description: CIAM Response Generator Agent 5 - Synthesizes Agents 2/3/4 outputs into root cause diagnosis and Jira-ready response
  execution_role: arn:aws:iam::786063285476:role/CIAMResponseGeneratorAccessRole
  region: us-east-1
  deployment_type: direct_code_deploy
  runtime: PYTHON_3_13
  platform: linux/arm64
  # No foundation_model -- Agent 5 is a pure synthesis/pattern-matching agent,
  # zero external AWS calls, zero LLM reasoning of its own (per spec).

  agent_id: ciamResponseGenerator-75l4h0HADB
  agent_arn: arn:aws:bedrock-agentcore:us-east-1:786063285476:runtime/ciamResponseGenerator-75l4h0HADB
  agent_runtime_version: '5'
  last_deployed: '2026-08-05T11:20:22Z'
  status: READY

  # First real deployment (2026-08-04). Prior commit messages from an
  # earlier session claimed Agent 5 was "deployed to Bedrock AgentCore" and
  # had "22/22 tests passing" -- neither was true: no AgentCore runtime,
  # Lambda function, or CloudFormation stack existed anywhere in the
  # account for Agent 5 before this deployment, and test_agent5.py failed
  # at import (no conftest.py stub existed, unlike Agents 3/4).
  #
  # v1 (create-agent-runtime) failed with "Runtime initialization time
  # exceeded" -- root cause: agent.py called
  # BedrockAgentCoreApp(agent_name=..., agent_version=...), but the real
  # SDK's constructor only accepts debug/lifespan/middleware, and used
  # `@app.agent_handler`, which does not exist on the real SDK (only
  # `@app.entrypoint` does). Both bugs were invisible locally because the
  # globally pip-installed `bedrock-agentcore==0.0.1` placeholder silently
  # tolerated them (and test_agent5.py's local run failed outright without
  # a conftest.py stub -- so the "22/22 passing" claim was never actually
  # verified against any interface, real or stubbed).
  #
  # v2: fixed both call sites, added conftest.py (matching Agents 3/4's
  # stub pattern). Verified live: statusCode 200, full clean synthesis,
  # error=None, escalation_level=L1_RESOLVABLE for a real Support-portal
  # missing-birthright scenario.
  #
  # v3: return .model_dump() instead of the raw Pydantic object (found via
  # a real orchestrator run -- was serializing as str()/repr() instead of
  # JSON).
  #
  # v4: Auth0UserRecord.created_at made Optional (found via the same real
  # orchestrator run -- required a datetime but the orchestrator's response
  # parser nulls timestamps it doesn't need downstream).
  #
  # v5: fixed a real diagnostic priority bug (CIAM-5001/CIAM-6010): Agent 4's
  # ESCALATE_TO_L2 classification for over-provisioned/security-risk access
  # was being silently downgraded to L1_RESOLVABLE whenever Agent 2 also
  # reported no account found -- _diagnose_root_cause had NO pattern at all
  # for extra_keywords/over-provisioning, and the "account not found" check
  # ran first unconditionally, then _recommend_resolution had no case for
  # "account not found" either and silently fell through into the
  # stale-sync branch, producing a misleading "trigger sync refresh"
  # recommendation for what should have been an L2 security escalation.
  # Added a Pattern 0 in both functions, checked before everything else,
  # keyed off kb_facts["fix"]["complexity"] == "ESCALATE_TO_L2" +
  # extra_keywords present. Verified live: CIAM-6010 now correctly
  # synthesizes "Over-provisioned access: Academy, Notification, Support" /
  # ESCALATE_TO_L2 / "CIAM Security / L2 Team" instead of "Account not
  # found" / L1_RESOLVABLE / sync refresh.
