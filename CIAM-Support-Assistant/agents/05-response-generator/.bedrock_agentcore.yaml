bedrock_agentcore:
  agent_name: ciam-response-generator
  description: CIAM Response Generator Agent 5 - Synthesizes Agents 2/3/4 outputs into root cause diagnosis and Jira-ready response
  execution_role: arn:aws:iam::786063285476:role/CIAMResponseGeneratorAccessRole
  region: us-east-1
  deployment_type: direct_code_deploy
  runtime: PYTHON_3_13
  platform: linux/arm64
  # No foundation_model -- Agent 5 is a pure synthesis/pattern-matching agent,
  # zero external AWS calls, zero LLM reasoning of its own (per spec).

  agent_id: ciamResponseGenerator-75l4h0HADB
  agent_arn: arn:aws:bedrock-agentcore:us-east-1:786063285476:runtime/ciamResponseGenerator-75l4h0HADB
  agent_runtime_version: '8'
  last_deployed: '2026-08-10T12:32:04Z'
  status: READY
  # v8: Pattern 1's recommended_actions loop gave every action the SAME
  # blanket rationale ("can be compensated via entitlements"), which became
  # visibly wrong once Agent 4 started emitting qualitatively different step
  # types for the pending-login-refresh case (v7) -- e.g. a "log out and log
  # back in" action was labeled with an entitlements rationale that has
  # nothing to do with it. Added _rationale_for_missing_portal_action(),
  # which derives each action's rationale from its own content (re-login vs.
  # entitlements vs. verify) instead of one shared sentence. Caught and fixed
  # a priority-order bug during verification: the conditional follow-up
  # action ("If still missing after a fresh login, add ... to ENTITLEMENTS")
  # mentions "fresh login" too, so checking the login phrases before
  # "entitlements" misclassified it -- reordered to check "entitlements"
  # first. Verified live: all 3 actions now get distinct, correct
  # rationales.
  status: READY
  # v7: consumes Agent 4's new SyncDiagnostics field (see Agent 4's v12
  # changelog) so multi-account ambiguity and pending-login-refresh
  # signals actually reach the final Jira-facing response instead of being
  # computed by Agent 4 and never used. Added two new root-cause patterns
  # ahead of the existing Pattern 0 (over-provisioned): Pattern -1
  # (multi-account/user ambiguity, checked before EVERYTHING -- other
  # signals could be about the wrong record) and Pattern -0.5 (Auth0 Action
  # code drift, matched on Agent 4's reason text since workflow_
  # identification isn't wired into Agent 5's input schema). Both reuse
  # Agent 4's own recommended_actions, same established pattern as Pattern
  # 0. Pattern 3 (missing portal access) now labels a pending-login-refresh
  # case distinctly while still matching the existing resolution logic via
  # substring, so Agent 4's "try a fresh login first" action flows through
  # unchanged. This closes the same class of regression Pattern 0 was
  # built for (CIAM-5001/6010): an Agent-4 ESCALATE_TO_L2 must never be
  # silently re-derived into a lower-priority pattern just because the new
  # signal didn't have dedicated wiring yet.
  #
  # v6: fixed a real terminology/logic bug (CIAM ops feedback, found via
  # CIAM-7501): Pattern 1 in _recommend_resolution (missing portal access)
  # re-derived its own action text -- "Add '{portal}' to birthright
  # entitlements" -- a made-up hybrid term that doesn't exist in the actual
  # data model and implied birthright itself is directly editable. Birthright
  # is computed by the NetskopeID-Sync-2 Auth0 Action from Salesforce Account
  # Status/Tenant Requests at every login and is NEVER manually edited; only
  # entitlements is the manually-editable compensating field. Fix: Pattern 1
  # now reuses Agent 4's own fix_classification.recommended_actions (same
  # approach Pattern 0 already used for the over-provisioned case), so the
  # wording can't drift out of sync with Agent 4's classification again.
  # Verified live: CIAM-7501 retest now recommends "Add ['Academy',
  # 'Notification'] to the ENTITLEMENTS array" instead of "birthright
  # entitlements".
  status: READY

  # First real deployment (2026-08-04). Prior commit messages from an
  # earlier session claimed Agent 5 was "deployed to Bedrock AgentCore" and
  # had "22/22 tests passing" -- neither was true: no AgentCore runtime,
  # Lambda function, or CloudFormation stack existed anywhere in the
  # account for Agent 5 before this deployment, and test_agent5.py failed
  # at import (no conftest.py stub existed, unlike Agents 3/4).
  #
  # v1 (create-agent-runtime) failed with "Runtime initialization time
  # exceeded" -- root cause: agent.py called
  # BedrockAgentCoreApp(agent_name=..., agent_version=...), but the real
  # SDK's constructor only accepts debug/lifespan/middleware, and used
  # `@app.agent_handler`, which does not exist on the real SDK (only
  # `@app.entrypoint` does). Both bugs were invisible locally because the
  # globally pip-installed `bedrock-agentcore==0.0.1` placeholder silently
  # tolerated them (and test_agent5.py's local run failed outright without
  # a conftest.py stub -- so the "22/22 passing" claim was never actually
  # verified against any interface, real or stubbed).
  #
  # v2: fixed both call sites, added conftest.py (matching Agents 3/4's
  # stub pattern). Verified live: statusCode 200, full clean synthesis,
  # error=None, escalation_level=L1_RESOLVABLE for a real Support-portal
  # missing-birthright scenario.
  #
  # v3: return .model_dump() instead of the raw Pydantic object (found via
  # a real orchestrator run -- was serializing as str()/repr() instead of
  # JSON).
  #
  # v4: Auth0UserRecord.created_at made Optional (found via the same real
  # orchestrator run -- required a datetime but the orchestrator's response
  # parser nulls timestamps it doesn't need downstream).
  #
  # v5: fixed a real diagnostic priority bug (CIAM-5001/CIAM-6010): Agent 4's
  # ESCALATE_TO_L2 classification for over-provisioned/security-risk access
  # was being silently downgraded to L1_RESOLVABLE whenever Agent 2 also
  # reported no account found -- _diagnose_root_cause had NO pattern at all
  # for extra_keywords/over-provisioning, and the "account not found" check
  # ran first unconditionally, then _recommend_resolution had no case for
  # "account not found" either and silently fell through into the
  # stale-sync branch, producing a misleading "trigger sync refresh"
  # recommendation for what should have been an L2 security escalation.
  # Added a Pattern 0 in both functions, checked before everything else,
  # keyed off kb_facts["fix"]["complexity"] == "ESCALATE_TO_L2" +
  # extra_keywords present. Verified live: CIAM-6010 now correctly
  # synthesizes "Over-provisioned access: Academy, Notification, Support" /
  # ESCALATE_TO_L2 / "CIAM Security / L2 Team" instead of "Account not
  # found" / L1_RESOLVABLE / sync refresh.
