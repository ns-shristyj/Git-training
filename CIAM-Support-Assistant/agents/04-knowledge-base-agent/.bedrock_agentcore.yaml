  knowledge_base:
    id: O4XMWIIEHS
    name: ciam-kb
    type: managed_vector_store
    data_source_s3: s3://ciam-agent4-kb-docs-786063285476-us-east-1/docs/
    note: >-
      26 real documents synced (8 core CIAM docs + 18 live Auth0 Action
      scripts fetched via the workflow-reader M2M app). Tool 4
      (identify_failing_workflow) resolved -- maps failures to
