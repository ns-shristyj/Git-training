---
# this specifies which servers to run this on
- hosts: all
  gather_facts: false
# means to become sudo
  become: true
  become_user: root
  become_method: sudo
  vars:
    created_username: ns-quinlan

  tasks:
    - name: Update apt
      apt:
        update_cache: yes
        upgrade: 'yes'  
    - name: Update apt and install required system packages
      apt:
        pkg:
          - curl
          - vim
          - git
          - rsync
          - nginx
          - nginx-extras
          - python3-pip
          - python3-dev
          - build-essential
          - libssl-dev
          - libffi-dev
          - python3-setuptools
          - zlib1g-dev
          - libncurses5-dev
          - libgdbm-dev
          - libnss3-dev
          - libreadline-dev
          - python3-venv
          - wget
          - unzip
        allow_unauthenticated: true
        state: latest
        update_cache: true
    - name: Configuring Ubuntu user
      expect:
        command: sudo passwd ubuntu
        responses:
          "New password:": "ubuntu"
          "Retype new password:": "ubuntu"
        timeout: 200
    - name: Cloning GitHub Repository
      git:
       repo: ChangeMe
       dest: /home/ubuntu/temp-repo/
       version: FLASK_webserver
    - name: Update the website files
      command: rsync -av --delete --exclude="/project-emu-develop/data" /home/ubuntu/temp-repo/ /home/ubuntu/GIS-SecEng-Intern/
    - name: Clean up
      file:
        path: /home/ubuntu/temp-repo/
        state: absent
    - name: Configuring Project Emu Directory
      shell: |
        sudo unzip -o /home/ubuntu/GIS-SecEng-Intern/project-emu-develop.zip -d /home/ubuntu/GIS-SecEng-Intern/
        sudo chmod -R u+rwx /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        sudo chown -R ubuntu:ubuntu /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        mv /home/ubuntu/GIS-SecEng-Intern/Ansible/files/.env /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/.env
        cd /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        make
        cd
    - name: Python Virtual Environment
      shell: |
        sudo python3 -m venv /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv
        sudo chmod -R u+rwx /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv
        sudo chown -R ubuntu:ubuntu /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv
        sudo /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv/bin/pip3 install --upgrade pip
        sudo /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv/bin/pip3 install wheel gunicorn Flask
        sudo /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv/bin/pip3 install -r /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/requirements.txt
        cd /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        sudo rm database.db
        sudo /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/venv/bin/python3 /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/init.py
    - name: Configuring Flask Application
      shell: |
        sudo chown -R ubuntu:ubuntu /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        sudo chmod -R u+rwx /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        cd /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
        sudo make
        cd ..
        cd ..
    - name: Configuring GUnicorn
      shell: |
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/files/app.service /etc/systemd/system/
        sudo chown ubuntu:ubuntu /home/ubuntu/GIS-SecEng-Intern/project-emu-develop/
    - name: Restarting Systemd Service
      shell: sudo systemctl daemon-reload && sudo systemctl restart app
    - name: Enable GUnicorn
      shell: |
        sudo systemctl start app
        sudo systemctl enable app
        sudo systemctl status app
    # Generate Certificate Authority (CA) self-signed certificate
    - name: Generate Certificate Authority (CA) self-signed certificate
      block:
        - name: Generate Root CA private key
          openssl_privatekey:
            path: /etc/ssl/private/nginx-selfsigned.key

        - name: Generate Root CA CSR
          openssl_csr:
            path: "/etc/ssl/certs/nginx-selfsigned.csr"
            privatekey_path: "/etc/ssl/private/nginx-selfsigned.key"
            common_name: 13.52.105.27
            organization_name: Netskope
            organizational_unit_name: Security Engineering
            basic_constraints:
              - CA:TRUE
            basic_constraints_critical: yes
            key_usage:
              - keyCertSign
              - digitalSignature
              - cRLSign
            key_usage_critical: yes

        - name: Generate Root CA certificate
          openssl_certificate:
            path: "/etc/ssl/certs/nginx-selfsigned.crt"
            privatekey_path: "/etc/ssl/private/nginx-selfsigned.key"
            csr_path: "/etc/ssl/certs/nginx-selfsigned.csr"
            provider: selfsigned
    # /Generate Certificate Authority (CA) self-signed certificate
    - name: Securing the Application
      shell: |
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/files/self-signed.conf /etc/nginx/snippets/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/files/ssl-params.conf /etc/nginx/snippets/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/files/nginx.conf /etc/nginx/nginx.conf
        sudo openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048
        sudo ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled
        sudo ufw app list
        sudo systemctl restart nginx
    - name: Configuring Nginx to Proxy Requests
      shell: |
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/files/app /etc/nginx/sites-available/
        sudo ln -s /etc/nginx/sites-available/app /etc/nginx/sites-enabled
        sudo nginx -t
        sudo systemctl restart nginx
        sudo ufw delete allow 5000
        sudo ufw allow 'Nginx Full'
        sudo chmod 755 /home/ubuntu
    - name: Implementing Fail2Ban
      git:
        repo: https://github.com/fail2ban/fail2ban.git
        dest: /home/ubuntu/fail2ban
    - name: Updating Fail2Ban Conf Files
      shell: |
        cd fail2ban && sudo python3 setup.py install && cd
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/fail2ban.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-arch.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-common.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-debain.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-fedora.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-freebsd.conf /etc/fail2ban/
        sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-openuse.conf /etc/fail2ban/
      # sudo cp /home/ubuntu/GIS-SecEng-Intern/Ansible/fail2ban/paths-osx.confs /etc/fail2ban/
      register: cp
      failed_when: cp.rc not in [ 0, 1 ]
    # To enable fail2ban as an automatic service, simply copy the script for your distro from the files directory to /etc/init.d. 
    # Example (on a Debian-based system):
    - name: Fail2Ban Configuration
      shell: |
        cd fail2ban
        sudo cp files/debian-initd /etc/init.d/fail2ban
        sudo update-rc.d fail2ban defaults
        sudo service fail2ban start
