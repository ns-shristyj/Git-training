---
- hosts: all
  become: true
  become_user: root
  become_method: sudo
  vars:
    created_username: ns-quinlan

  tasks:
    - name: Another way to call known_hosts
      ansible.builtin.known_hosts:
        name: 54.183.103.225   # or 10.9.8.77
        key: 54.183.103.225,54.183.103.225 ssh-rsa 
        path: /.ssh/known_hosts
        state: present
    - name: Install nginx
      apt:
        name: nginx
        state: latest
    - name: Install pip
      apt:
        update_cache: yes
        name: python3-pip
    - name: Setup passwordless sudo
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'
    - name: Create a new regular user with sudo privileges
      user:
        name: "{{created_username}}"
        state: present
        groups: sudo 
        append: true
        create_home: true
    - name: Disable password auth for root
      lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
    - name: Update apt and install required system packages
      apt:
        pkg:
          - curl
          - vim
          - git
          - ufw
        state: latest
        update_cache: true
    - name: UFW - Allow SSH connections
      community.general.ufw:
        rule: allow
        name: OpenSSH
    - name: UFW - Enable and deny by default
      community.general.ufw:
        state: enabled
        default: deny
    - name: Copy Cobalt Strike
      copy:
        src: cobaltstrike-dist.tgz
        dest: /tmp/cobaltstrike-dist.tgz
    - name: Install Cobalt Strike
      apt:
        deb: /tmp/cobaltstrike-dist.tgz
      become: true
