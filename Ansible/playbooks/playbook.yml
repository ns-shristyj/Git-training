---
# this specifies which servers to run this on
- hosts: all
  gather_facts: false
# means to become sudo
  become: true
  become_user: root
  become_method: sudo
  vars:
    created_username: ns-quinlan

  tasks:
    - name: Update apt
      apt:
        update_cache: yes
        upgrade: 'yes'  
    # another way of saying sudo apt install nginx
    - name: Installing Debian Keyring
      command: sudo apt install -y debian-keyring debian-archive-keyring apt-transport-https
    - name: Installing Caddy
      command: sudo apt install caddy
    - name: Install nginx
      apt:
        name: nginx
        state: latest
    - name: Install pip
      apt:
        update_cache: yes
        name: python3-pip
    - name: Setup passwordless sudo
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'
    - name: Create a new regular user with sudo privileges
      user:
        name: "{{created_username}}"
        state: present
        groups: sudo 
        append: true
        create_home: true
    - name: Disable password auth for root
      lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
    - name: Update apt and install required system packages
      apt:
        pkg:
          - curl
          - vim
          - git
        state: latest
        update_cache: true