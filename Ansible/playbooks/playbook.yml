---
# this specifies which servers to run this on
- hosts: all
  gather_facts: false
# means to become sudo
  become: true
  become_user: root
  become_method: sudo
  vars:
    created_username: ns-quinlan

  tasks:
    - name: Update apt
      apt:
        update_cache: yes
        upgrade: 'yes'  
    - name: Update apt and install required system packages
      apt:
        pkg:
          - curl
          - vim
          - git
        state: latest
        update_cache: true
    - name: Install nginx
      apt:
        name: nginx
        state: latest
    - name: Installing Dependencies
      shell: |
        sudo apt install python3-pip python3-dev build-essential libssl-dev libffi-dev python3-setuptools
        sudo apt install python3-venv
        pip install wheel
        sudo apt update 
    - name: Python Virtual Environment
      shell: |
        python3 -m venv .venv
        source .venv/bin/activate
        pip install gunicorn Flask
        deactivate