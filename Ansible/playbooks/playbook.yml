---
# this specifies which servers to run this on
- hosts: all
# means to become sudo
  become: true
  become_user: root
  become_method: sudo
  vars:
    created_username: ns-quinlan

  tasks:
    - name: Update apt
      apt:
        update_cache: yes
        upgrade: 'yes'
    # another way of saying sudo apt install nginx
    - name: Install nginx
      apt:
        name: nginx
        state: latest
    - name: Install pip
      apt:
        update_cache: yes
        name: python3-pip
    - name: Setup passwordless sudo
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%sudo'
        line: '%sudo ALL=(ALL) NOPASSWD: ALL'
        validate: '/usr/sbin/visudo -cf %s'
    - name: Create a new regular user with sudo privileges
      user:
        name: "{{created_username}}"
        state: present
        groups: sudo 
        append: true
        create_home: true
    - name: Disable password auth for root
      lineinfile:
        path: /etc/ssh/sshd_config
        state: present
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
    - name: Update apt and install required system packages
      apt:
        pkg:
          - curl
          - vim
          - git
          - ufw
        state: latest
        update_cache: true
    - name: UFW - Allow SSH connections
      community.general.ufw:
        rule: allow
        name: OpenSSH
    - name: UFW - Enable and deny by default
      community.general.ufw:
        state: enabled
        default: deny
    - name: Copy Cobalt Strike
      copy:
        src: cobaltstrike-dist.tgz
        dest: /tmp/cobaltstrike-dist.tgz
    - name: Install Cobalt Strike
      command: >
        /tmp/cobaltstrike-dist.tgz 
        --license-key={{license_key}}
      args:
        executable: /bin/bash
