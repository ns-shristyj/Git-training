name: aws-dashboard

on: 
  workflow_dispatch:

jobs:
  run-script:
    runs-on: arc-default-basic-cheap-s-set

    steps:
      - name: checkout
        uses: actions/checkout@v4.0.0
      - name: Set up Python 3.12
        uses: actions/setup-python@v4.0.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: pip install boto3 python-dotenv google-api-python-client google-auth-httplib2 google-auth-oauthlib


      - name: Run the AWS Dashboard Data Update Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DASHBOARD_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DASHBOARD_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_DASHBOARD_SESSION_TOKEN }}
          AWS_DASHBOARD_GOOGLE_SECRET: ${{ secrets.AWS_DASHBOARD_GOOGLE_SECRET }}
          FILE_PATH: ${{ github.workspace }}/aws_dashboard/secret.json
        run: |-
          cd "${{ github.workspace }}/aws_dashboard/"
          echo "$AWS_DASHBOARD_GOOGLE_SECRET" > secrets.json
          python *.py
