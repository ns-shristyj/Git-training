name: Run Bot Unit Tests

on:
  workflow_run:
    workflows: ["Generate Unit Test", "Refine Unit Test"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  run-tests:
    name: Execute Unit Tests
    runs-on: arc-default-ub24-m-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
      - name: Fetch base branch for Diffing
        run: git fetch origin develop --depth=1

      - name: Capture current HEAD SHA
        id: head_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Update or Create Check Run
        id: create_check
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.head_sha.outputs.sha }}';
            const checkName = 'Bot Unit Tests';
            
            // 1. Search for the queued check run created by the previous workflow
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
              check_name: checkName
            });
            
            let checkId;
            
            // 2. If it exists, update it to 'in_progress'
            if (checks.total_count > 0) {
              checkId = checks.check_runs[0].id;
              await github.rest.checks.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                check_run_id: checkId,
                status: 'in_progress'
              });
              console.log(`Found and updated existing check run: ${checkId}`);
            } else {
              // 3. Fallback: Create a new one if the search fails
              const { data: check } = await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: checkName,
                head_sha: sha,
                status: 'in_progress',
              });
              checkId = check.id;
              console.log(`Created new check run: ${checkId}`);
            }
            
            // Output the ID so the final step can close it
            core.setOutput('check_id', checkId);

      - name: Detect New or Modified Test Files
        id: detect_tests
        run: |
          # workflow_run.head_sha is pinned to the commit that TRIGGERED the
          # generate workflow, which is BEFORE it pushes the generated test
          # file commit. Checkout head_branch (moving ref) instead, and diff
          # against the pre-trigger SHA so the generated commit is included.
          COMPARE_REF="${{ github.event.workflow_run.head_sha }}"

          echo "Evaluating changes between $COMPARE_REF and HEAD..."

          # Find any Python files added, copied, or modified in the tests/ folder
          CHANGED_TESTS=$(git diff --name-only --diff-filter=AM $COMPARE_REF HEAD | grep -E '^Agentic_Unit_Test_Generator/tests/test_[^/]+\.py$' | xargs)  
          echo "$CHANGED_TESTS"        
          if [ -z "$CHANGED_TESTS" ]; then
            echo "No test files were added or modified in this commit."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "Detected test files to run: $CHANGED_TESTS"
            echo "test_files=$CHANGED_TESTS" >> "$GITHUB_OUTPUT"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.detect_tests.outputs.run_tests == 'true'
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          # Add any dependencies your calculator application requires here
          if [ -f requirements.txt ]; then pip3 install --break-system-packages -r requirements.txt; fi
          pip3 install --break-system-packages pytest pytest-cov # Ensures pytest is available to run the tests
          pip3 install --break-system-packages requests  # Ensures requests is available for Mocking API calls
      
      - name: Run Test Suite and Generate JUnit XML
        if: steps.detect_tests.outputs.run_tests == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          TARGET_TESTS: ${{ steps.detect_tests.outputs.test_files }}
        run: |
          echo "🚀 Executing pytest on: $TARGET_TESTS"
          # Run only the detected test files. '|| true' ensures we still parse results if tests fail.
          pytest $TARGET_TESTS --cov=. --cov-report=term --cov-report=xml:${{ github.workspace }}/coverage.xml --junitxml=${{ github.workspace }}/dynamic_test_report.xml -v || true

      - name: Parse Test Results
        if: always() && steps.detect_tests.outputs.run_tests == 'true'
        run: |
              if [ "${{ steps.detect_tests.outputs.run_tests }}" = "false" ]; then
                # Clean skip notice if no tests were touched
                echo "### No Test Execution Required" > pr_comment.md
                echo "This PR update did not contain new or modified test files inside the test suite directory." >> pr_comment.md
              elif [ -s "${{ github.workspace }}/dynamic_test_report.xml" ]; then
                echo "Parsing test and coverage results..."
                # Passed coverage.xml as an extra positional parameter argument
                python3 Agentic_Unit_Test_Generator/scripts/parse.py \
                  "${{ github.workspace }}/dynamic_test_report.xml" "python" "${{ github.workspace }}/coverage.xml"
              else
                echo "No report found."
                echo "### ⏳ No test results yet" > pr_comment.md
                echo "The test suite did not produce a report. Check the run logs." >> pr_comment.md
              fi

      - name: Post Results to PR
        if: always() && steps.detect_tests.outputs.run_tests == 'true'
        uses: actions/github-script@v7
        with:
          script: |
                const fs = require('fs');
                const commentFile = 'pr_comment.md';

                if (!fs.existsSync(commentFile)) {
                  console.log('No pr_comment.md found — skipping comment.');
                  return;
                }

                const body = fs.readFileSync(commentFile, 'utf8');
                const marker = '<!-- bot-unit-test-results -->';
                const markedBody = marker + '\n' + body;

                // Find PRs associated with this commit
                const prList = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: '${{ github.event.workflow_run.head_sha }}'
                });

                // Find an open PR that targets the develop branch
                const openPR = prList.data.find(pr => pr.state === 'open' && pr.base.ref === 'develop');

                if (!openPR) {
                  console.log('No active PR found. Skipping comment.');
                  return;
                }

                const prNumber = openPR.number;
                console.log(`Found PR #${prNumber}. Posting test results.`);

                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                });

                const existing = comments.data.find(c => c.body.includes(marker));

                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                  console.log('Deleted old comment.');
                }
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: markedBody,
                  });
                  console.log('Created new comment.');
                

      - name: Complete Check Run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
                const fs = require('fs');
                const checkId = '${{ steps.create_check.outputs.check_id }}';
                if (!checkId) {
                  console.log('No check run was created — skipping.');
                  return;
                }

                const runTests = '${{ steps.detect_tests.outputs.run_tests }}' === 'true';
                
                // If tests were triggered, call it a success. Otherwise, neutral.
                const conclusion = runTests ? 'success' : 'neutral';
                const summary = runTests 
                  ? 'Bot workflow executed successfully (ignoring actual test results for now).' 
                  : 'No new or modified test files were detected in this push.';

                await github.rest.checks.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  check_run_id: checkId,
                  status: 'completed',
                  conclusion,
                  output: {
                    title: 'Bot Unit Tests',
                    summary,
                  },
                });
                console.log(`Check run completed with conclusion: ${conclusion}`);