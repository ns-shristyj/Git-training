name: Endor Labs Dependency and Secrets Scan
on:
  push:
jobs:
  endor_scan:
    permissions:
      security-events: write # Used to upload Sarif artifact to GitHub
      contents: read # Used to check out a private repository
      actions: read # Required for private repositories to upload Sarif files. GitHub Advanced Security licenses are required.
      id-token: write # Used for keyless authentication with Endor Labs
      issues: write # Required to automatically comment on PRs for new policy violations
      pull-requests: write # Required to automatically comment on PRs for new policy violations
    runs-on: [self-hosted, linux, x64, rg-default, sz-S, cheap, docker]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'oracle' # See 'Supported distributions' for available options
          java-version: '21'

      - name: Install Python (if needed)
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' # Specify the required Python version

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry

      - name: Find and Build Projects with requirements.txt
        run: |
          # Loop through all folders and check for requirements.txt
          for dir in $(find . -type d); do
            if [ -f "$dir/requirements.txt" ]; then
              echo "Found requirements.txt in $dir"
              cd $dir
              python -m pip install -r requirements.txt
              # Add custom build logic here if needed (e.g., run tests or build commands)
              echo "Installed and built project in $dir"
              cd - # Go back to the root folder
            else
              echo "No requirements.txt found in $dir"
            fi
          done

      - name: Endor Labs Scan Pull Request
        uses: endorlabs/github-action@v1.1.1
        with:
          namespace: 'netskope' # Replace with your Endor Labs tenant namespace
          scan_dependencies: true
          scan_secrets: true
          enable_github_action_token: true # This is required to have the GitHub Action use OIDC authentication
          pr: false
