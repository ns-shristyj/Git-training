name: Cleanup Old Workflows

on:
  workflow_dispatch: # Allows manual triggering

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Delete workflows older than one month
        env:
          NSCQUINLAN_GHA_TOKEN: ${{ secrets.NSCQUINLAN_GHA_TOKEN }}
        run: |
          echo "Fetching workflow runs older than one month..."
          one_month_ago=$(date -d '1 month ago' --utc +%Y-%m-%dT%H:%M:%SZ)
          repo="netSkope/GIS-SecEng-Intern"
          page=1
          old_runs=""

          while : ; do
            response=$(curl -s -H "Authorization: token $NSCQUINLAN_GHA_TOKEN" "https://api.github.com/repos/$repo/actions/runs?per_page=100&page=$page")
            echo "API response: $response" # Debugging line

            if echo "$response" | jq -e '.message' > /dev/null; then
              echo "Error from API: $(echo "$response" | jq -r '.message')"
              exit 1
            fi

            runs=$(echo "$response" | jq -r --arg one_month_ago "$one_month_ago" '.workflow_runs[] | select(.created_at < $one_month_ago) | .id')

            if [ -z "$runs" ]; then
              break
            fi

            old_runs="$old_runs $runs"
            page=$((page + 1))
          done

          if [ -z "$old_runs" ]; then
            echo "No workflow runs found older than one month."
          else
            for run_id in $old_runs; do
              echo "Deleting workflow run $run_id..."
              curl -s -X DELETE -H "Authorization: token $NSCQUINLAN_GHA_TOKEN" "https://api.github.com/repos/$repo/actions/runs/$run_id"
            done
            echo "Cleanup complete!"
          fi
