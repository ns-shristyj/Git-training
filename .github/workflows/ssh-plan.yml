name: SSH ACTION

on:
  push:
    branches: [ "ns-cquinlan" ]
  pull_request:
    branches: [ "ns-cquinlan" ]

jobs:
  deploy:
    runs-on: ["self-hosted", "linux", "x64", "sz-XS", "gh", "cheap"]
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SECENG_INTERN_KEY_PAIR }}
      - run: |
          ssh -i ${{ secrets.SECENG_INTERN_KEY_PAIR }} ubuntu@54.183.103.225
          ls
          echo "Test"