name: Terraform Plan Action

on:
  push:
    branches: [ "ns-cquinlan" ]
  pull_request:
    branches: [ "ns-cquinlan" ]

jobs:
    steps:
    - uses: shimataro/ssh-key-action@v2
    - name: Install SSH Key
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        known_hosts: 
    - name: Adding Known Hosts
      run: ssh-keyscan -H 54.183.103.225 >> ~/.ssh/known_hosts
    - name: Deploy with rsync
      run: rsync -avz ./dist/ ubuntu@54.183.103.225:/home/ubuntu/54.183.103.225/dist/