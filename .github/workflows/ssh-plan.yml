name: SSH ACTION

on:
  push:
    branches: [ "ns-cquinlan" ]
  pull_request:
    branches: [ "ns-cquinlan" ]

jobs:
  deploy:
    runs-on: ["self-hosted", "linux", "x64", "sz-XS", "gh", "cheap"]
    
    steps:

      - uses: actions/checkout@v4
    
      - name: Set Up SSH Host key
        run: |
          mkdir -p ~/.ssh/
          echo -e "-----BEGIN RSA PRIVATE KEY-----\n${{ secrets.SECENG_INTERN_KEY_PAIR_CQUINLAN }}\n-----END RSA PRIVATE KEY-----" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa 54.183.103.225 >> ~/.ssh/known_hosts
      - name: /.ssh/ content
        run: ls -la ~/.ssh/
      - name: Install SSH Key
        id: ssh
        working-directory: ./Ansible
        env:
          ssh-private-key: ${{ secrets.SECENG_INTERN_KEY_PAIR_CQUINLAN }}
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@54.183.103.225 "echo Hello"