name: dump_csv

on:
  push:
    branches: ["ns-tsingh"]



jobs:
  build:
      runs-on: ubuntu-latest
    
      steps:
      - uses: hashicorp/vault-action@v2
        with:
            url: "https://global.prod.kms.nskope.net"
            method: approle
            roleId: ${{ secrets.GH_ACTIONS_VAULT_APPROLE_ID }}
            password: ${{ secrets.GH_ACTIONS_APPROLE_SECRET}}
            secrets: |
                    github-action/Security_Stack_Asset | dumy_intern_token ;
      - name: Echo dumy token   
        run: |
              echo  "${{ env.dumy_intern_token}}"

