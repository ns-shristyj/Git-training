name: dump_csv

on:
  push:
    branches: ["ns-tsingh"]



jobs:
  build:
      runs-on: ubuntu-latest
    
      steps:

      - name: Checkout 🛎️
        uses: actions/checkout@v4  

        
      - uses: hashicorp/vault-action@v2.5.0
        with:
            url: "https://global.prod.kms.nskope.net"
            method: approle
            roleId: ${{ secrets.GH_ACTIONS_VAULT_APPROLE_ID }}
            password: ${{ secrets.GH_ACTIONS_APPROLE_SECRET}}
            secrets: |
                    github-action/Security_Stack_Asset | dumy_intern_token ;
      - name: Echo dumy token   
        run: |
              python -m pip install --upgrade pip
              pip install --upgrade google-api-python-client
              gcloud beta auth application-default login
              python  dump_csv.py

