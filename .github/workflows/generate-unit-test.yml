name: Generate Unit Test

on:
  pull_request:
    branches: [develop]
    types: [opened]

permissions:
  id-token: write
  contents: write

jobs:
  generate-test:
    runs-on: arc-default-basic-cheap-s-set
    steps:

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Evaluate eligible source files dynamically
        id: filter_engine
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | \
          python Agentic_Unit_Test_Generator/scripts/filter_source_files.py >> "$GITHUB_OUTPUT"
 
      - name: Check if test already exists for this file
        id: check_existing
        if: steps.filter_engine.outputs.run_generation == 'true'
        run: |
          TEST_FILE="${{ steps.filter_engine.outputs.test_file }}"
          if [ -f "$TEST_FILE" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "[check] Test already exists at $TEST_FILE — skipping generation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "[check] No existing test at $TEST_FILE — proceeding."
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Set up Python
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        run: pip install "boto3>=1.40"

      - name: Generate unit test via Unit Test Generator Agent
        id: generate
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        env:
          UNIT_TEST_GEN_BUCKET: netskope-unit-test-gen-786063285476-ap-southeast-2
          AGENT_RUNTIME_ARN: ${{ vars.AGENT_RUNTIME_ARN }}
        run: |
          S3_OUTPUT_KEY="generated-tests/${{ github.run_id }}/${{ steps.filter_engine.outputs.filename_raw }}"
          python Agentic_Unit_Test_Generator/scripts/generate_unit_test.py \
            "${{ steps.filter_engine.outputs.source_file }}" \
            "$S3_OUTPUT_KEY"
          echo "s3_output_key=$S3_OUTPUT_KEY" >> "$GITHUB_OUTPUT"

      - name: Download generated test file from S3
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        run: |
          mkdir -p "$(dirname "${{ steps.filter_engine.outputs.test_file }}")"
          aws s3 cp \
            "s3://netskope-unit-test-gen-786063285476-ap-southeast-2/${{ steps.generate.outputs.s3_output_key }}" \
            "${{ steps.filter_engine.outputs.test_file }}"

      - name: Commit and push generated test file
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.check_existing.outputs.exists == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.filter_engine.outputs.test_file }}"
          git commit -m "Add Generated Unit Test For ${{ steps.filter_engine.outputs.filename_raw }}"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}