name: Generate Unit Test

on:
  pull_request:
    types: [opened]
    branches: [develop]

permissions:
  id-token: write
  contents: write

jobs:
  generate-test:
    runs-on: arc-default-basic-cheap-s-set
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Check if a test file already exists
        id: check_existing
        run: |
          if [ -f "Agentic-Unit-Test-Generator/tests/test_calculator.py" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Test file already exists — skipping generation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_existing.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_existing.outputs.exists == 'false'
        run: pip install boto3

      - name: Verify AWS connection
        run: |
            echo "AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION"
            echo "AWS_REGION: $AWS_REGION"
            python3 -c "import boto3; print('boto3 default region:', boto3.session.Session().region_name)"
            
      - name: Generate unit test via Bedrock
        if: steps.check_existing.outputs.exists == 'false'
        run: |
          python Agentic-Unit-Test-Generator/scripts/generate_unit_test.py \
            NIC-SecEng-Task/Calculator/calculator.py \
            Agentic-Unit-Test-Generator/tests/test_calculator.py