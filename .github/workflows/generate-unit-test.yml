name: Generate Unit Test

on:
  pull_request:
    branches: [develop]
    types: [opened]

permissions:
  id-token: write
  contents: write
  actions: write
  statuses: write

jobs:
  generate-test:
    runs-on: arc-default-basic-cheap-s-set
    steps:

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Evaluate eligible source files dynamically
        id: filter_engine
        run: |
          git diff --name-only origin/${{ github.event.pull_request.base.ref }} HEAD | \
          python Agentic_Unit_Test_Generator/scripts/filter_source_files.py >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials via OIDC
        if: steps.filter_engine.outputs.run_generation == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Set up Python
        if: steps.filter_engine.outputs.run_generation == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.filter_engine.outputs.run_generation == 'true'
        run: pip install "boto3>=1.40"

      - name: Generate unit tests via Unit Test Generator Agent
        id: generate
        if: steps.filter_engine.outputs.run_generation == 'true'
        env:
          AGENT_RUNTIME_ARN: ${{ vars.AGENT_RUNTIME_ARN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_FILES_JSON: ${{ steps.filter_engine.outputs.source_files }}
        run: |
          GENERATED_FILES=()
          FAILED_FILES=()

          while IFS=$'\t' read -r source_file test_file; do
            echo "=== Generating test for $source_file -> $test_file ==="
            if python Agentic_Unit_Test_Generator/scripts/generate_unit_test.py "$source_file" "$test_file"; then
              GENERATED_FILES+=("$test_file")
            else
              echo "::warning::Generation failed for $source_file — skipping, continuing with remaining files."
              FAILED_FILES+=("$source_file")
            fi
          done < <(python3 -c "
          import json, os
          pairs = json.loads(os.environ['SOURCE_FILES_JSON'])
          for p in pairs:
              print(f\"{p['source_file']}\t{p['test_file']}\")
          ")

          printf '%s\n' "${GENERATED_FILES[@]}" > "$GITHUB_WORKSPACE/.generated_test_files.txt"

          echo "generated_count=${#GENERATED_FILES[@]}" >> "$GITHUB_OUTPUT"
          echo "failed_count=${#FAILED_FILES[@]}" >> "$GITHUB_OUTPUT"

          if [ ${#GENERATED_FILES[@]} -eq 0 ]; then
            echo "has_generated_files=false" >> "$GITHUB_OUTPUT"
            if [ ${#FAILED_FILES[@]} -gt 0 ]; then
              echo "::error::All ${#FAILED_FILES[@]} eligible file(s) failed generation. Failing the job."
              exit 1
            fi
          else
            echo "has_generated_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push generated test files
        id: git_push
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.generate.outputs.has_generated_files == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          while IFS= read -r test_file; do
            [ -n "$test_file" ] && git add "$test_file"
          done < "$GITHUB_WORKSPACE/.generated_test_files.txt"

          COUNT="${{ steps.generate.outputs.generated_count }}"
          if [ "$COUNT" -eq 1 ]; then
            FILE=$(head -n1 "$GITHUB_WORKSPACE/.generated_test_files.txt")
            git commit -m "Add Generated Unit Test For $(basename "$FILE")"
          else
            git commit -m "Add Generated Unit Tests For $COUNT Files" -m "$(cat "$GITHUB_WORKSPACE/.generated_test_files.txt")"
          fi

          TARGET_BRANCH="${{ github.event.pull_request.head.ref }}"
          
          for i in {1..3}; do
            echo "Syncing remote changes via rebase (Attempt $i)..."
            # Pull the absolute latest history before pushing
            if git pull --rebase origin "$TARGET_BRANCH"; then
              echo "Pushing generated tests..."
              if git push origin HEAD:"$TARGET_BRANCH"; then
                echo "Successfully pushed generated tests!"
                NEW_COMMIT_SHA=$(git rev-parse HEAD)
                echo "new_sha=$NEW_COMMIT_SHA" >> "$GITHUB_OUTPUT"
                echo "Captured new remote SHA: $NEW_COMMIT_SHA"
                exit 0
              fi
            fi
            echo "Branch state diverged mid-flight. Retrying in 5 seconds..."
            sleep 5
          done

          echo "Error: Failed to push generated tests after 3 attempts due to branch activity."
          exit 1
      - name: Trigger Automated Unit Tests Workflow
        if: steps.filter_engine.outputs.run_generation == 'true' && steps.generate.outputs.has_generated_files == 'true' && steps.git_push.outputs.new_sha != ''
        uses: actions/github-script@v7
        with:
          script: |
            // 1. 🛠️ USE THE FRESH BOT COMMIT SHA: Read the output variable directly
            const targetSha = '${{ steps.git_push.outputs.new_sha }}';
            
            // 🛠️ FIX 1: Cleanly extract the raw branch name (avoids the refs/pull/ merge ref crash)
            let targetRef = '';
            if (context.payload.pull_request) {
              targetRef = context.payload.pull_request.head.ref;
            } else {
              targetRef = context.ref.replace('refs/heads/', '');
            }

            console.log(`Target Commit SHA for Status Check: ${targetSha}`);
            console.log(`Target Branch Ref for Workflow Dispatch: ${targetRef}`);

            // 🛠️ FIX 2: Removed 'target_url' so it doesn't link to the bot workflow.
            // GitHub will automatically link this status to the incoming run once it initializes!
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: targetSha,
              state: 'pending', 
              context: 'Execute Unit Tests', 
              description: 'Agentic test runner suite is spinning up...'
            });

            console.log(`Successfully registered pending commit status check on ${targetSha}.`);

            // 3. Trigger the actual testing workflow execution block
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'run-unit-test.yml', 
              ref: targetRef
            });