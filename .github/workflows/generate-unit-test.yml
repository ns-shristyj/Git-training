name: Generate Unit Test

on:
  pull_request:
    branches: [develop]
    types: [opened]

permissions:
  id-token: write
  contents: write

jobs:
  generate-test:
    runs-on: arc-default-basic-cheap-s-set
    steps:

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check if a test file already exists
        id: check_existing
        run: |
          if [ -f "Agentic_Unit_Test_Generator/tests/test_calculator.py" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Test file already exists — skipping generation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials via OIDC
        if: steps.check_existing.outputs.exists == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Set up Python
        if: steps.check_existing.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_existing.outputs.exists == 'false'
        run: pip install boto3
        
      - name: Generate unit test via Bedrock
        if: steps.check_existing.outputs.exists == 'false'
        run: |
          python Agentic_Unit_Test_Generator/scripts/generate_unit_test.py \
            Agentic_Unit_Test_Generator/scripts/calculator.py \
            Agentic_Unit_Test_Generator/tests/test_calculator.py
            
      - name: Commit and push generated test file
        if: steps.check_existing.outputs.exists == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Agentic_Unit_Test_Generator/tests/test_calculator.py
          git commit -m "Add Generated Unit Test For calculator.py"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any dependencies your calculator application requires here
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest  # Ensures pytest is available to run the tests
      
      - name: Run Test Suite and Generate JUnit XML
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          TARGET_TEST="Agentic_Unit_Test_Generator/tests/test_calculator.py"
          
          if [ -f "$TARGET_TEST" ]; then
            echo "✅ Test file found. Running pytest..."
            # Generates the XML report. The '|| true' ensures the pipeline doesn't 
            # instantly crash on failed tests before your parser can read them.
            pytest "$TARGET_TEST" --junitxml=${{ github.workspace }}/test_calculator_report.xml -v || true
          else
            echo "⚠️ Expected test file at $TARGET_TEST was not found."
            exit 0
          fi

      - name: Parse and Decorate Test Results
        # if: always() ensures the decoration runs whether tests pass or fail
        if: always() 
        run: |
          if [ -s "${{ github.workspace }}/test_calculator_report.xml" ]; then
            echo "📊 Parsing test results..."
            python Agentic_Unit_Test_Generator/scripts/parse.py "${{ github.workspace }}/test_calculator_report.xml" "python"
          else
            echo "No test_calculator_report.xml found to parse."
            echo "### ❌ Test Suite Error" > pr_comment.md
            echo "The automated test suite execution crashed completely, and no valid JUnit test report was generated." >> pr_comment.md
          fi

      - name: Post Results to PR Conversation
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: unit-test-results
          path: pr_comment.md