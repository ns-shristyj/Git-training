# 3. Create Jobs.
#     - Start a virtual environment using Python3
#     - Running a pip install GUnicorn
#     - Uncomment one of the jobs below that will be responsible for setting up SSH on the Runner.
#     - One of these jobs will be running a Ansible Playbook on a Ubuntu Server through SSH. You
#       won't have to create a playbook (unless you want to) but that will mainly be done on my end.

# We will be using our own ubuntu server, not GitHub's. To do that, specify with the runs-on command:
# runs-on: ["self-hosted", "linux", "x64", "sz-XS", "gh", "cheap"]

# We have several variables that are encrypted that can be and will be called in this project. 
# Although, I'm unsure if you will need AWS Keys, but just in case I will list them here:
# AWS Public Access Key: ${{secrets.AWS_ACCESS_KEY}}
# AWS Secret Access Key: ${{secrets.AWS_SECRET_ACCESS_KEY}}

# One of the most important variables that we have encrypted with GitHub Secrets is called a SSH Key.
# This key is what allows a user to be able to connect from one remote device to another, this is
# especially important when it comes to security. A lot of this has been done already, but it's important
# to know what it's called:
# The Ubuntu SSH Key: ${{secrets.SECENG_INTERN_KEY_PAIR}}
#   - After the Job "Set Up SSH Host Key" is ran, the key will then be called: "~/.ssh/id_rsa" 

