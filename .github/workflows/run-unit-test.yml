name: Run Automated Unit Tests

on:
  pull_request:
    branches: [develop]
    types: [synchronize, opened, reopened]
    paths:
      - 'Agentic_Unit_Test_Generator/tests/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  run-tests:
    name: Execute Unit Tests
    runs-on: arc-default-basic-cheap-s-set
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any dependencies your calculator application requires here
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest  # Ensures pytest is available to run the tests
      
      - name: Run Test Suite and Generate JUnit XML
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          TARGET_TEST="Agentic_Unit_Test_Generator/tests/test_calculator.py"
          
          if [ -f "$TARGET_TEST" ]; then
            echo "✅ Test file found. Running pytest..."
            # Generates the XML report. The '|| true' ensures the pipeline doesn't 
            # instantly crash on failed tests before your parser can read them.
            pytest "$TARGET_TEST" --junitxml=${{ github.workspace }}/test_calculator_report.xml -v || true
          else
            echo "⚠️ Expected test file at $TARGET_TEST was not found."
            exit 0
          fi

      - name: Parse and Decorate Test Results
        if: always()
        run: |
          if [ -s "${{ github.workspace }}/test_calculator_report.xml" ]; then
            echo "Parsing test results..."
            python Agentic_Unit_Test_Generator/scripts/parse.py \
              "${{ github.workspace }}/test_calculator_report.xml" "python"
          else
            echo "No report found to parse."
          fi

      - name: Post Results to PR
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "${{ github.workspace }}/test_calculator_report.xml"
          comment_title: "Unit Test Results"
          check_name: "Unit Test Results"