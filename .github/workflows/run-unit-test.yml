name: Run Automated Unit Tests

on:
  push:
    branches:
      - 'ns-apanikar/project/**'
    paths:
      - 'NIC_SecEng_Task/**'

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  run-tests:
    name: Execute Unit Tests
    runs-on: arc-default-ub24-m-set
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Fetch base branch for Diffing
        run: |
          git remote set-branches origin develop
          git fetch origin develop

      - name: Detect New or Modified Test Files
        id: detect_tests
        run: |
          # 1. DETERMINE WHAT CHANGED IN THIS EXACT PUSH
          BEFORE_SHA="${{ github.event.before }}"
          
          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid previous commit SHA found in event payload. Defaulting to HEAD^."
            COMPARE_REF="HEAD^"
          else
            COMPARE_REF="$BEFORE_SHA"
          fi

          echo "Evaluating changes in this specific push ($COMPARE_REF to HEAD)..."
          PUSH_CHANGED_FILES=$(git diff --name-only --diff-filter=AM $COMPARE_REF HEAD | grep -E '\.py$' || true)

          # 2. DETERMINE WHAT WAS NEWLY CREATED IN THIS PR (Branch lifespan)
          MERGE_BASE=$(git merge-base origin/develop HEAD)
          echo "🔍 DEBUG: Merge base with develop is: $MERGE_BASE"
          
          echo "Evaluating files newly added in this PR (since branch off $MERGE_BASE)..."
          PR_ADDED_FILES=$(git diff --name-only --diff-filter=AM $MERGE_BASE HEAD || true)
          
          echo "🔍 DEBUG: Files Git considers 'Added' in this PR:"
          echo "$PR_ADDED_FILES"
          echo "------------------------------------------------"

          TESTS_TO_RUN=""

          for file in $PUSH_CHANGED_FILES; do
            if [[ "$file" == Agentic_Unit_Test_Generator/tests/test_*.py ]]; then
              echo "✅ Test file directly updated: $file"
              TESTS_TO_RUN="$TESTS_TO_RUN $file"
            else
              BASENAME=$(basename "$file" .py)
              EXPECTED_TEST_FILE="Agentic_Unit_Test_Generator/tests/test_${BASENAME}.py"
              
              echo "🔍 DEBUG: Source file modified: $file"
              echo "🔍 DEBUG: Looking for expected test file: $EXPECTED_TEST_FILE"
              
              if [ -f "$EXPECTED_TEST_FILE" ]; then
                echo "🔍 DEBUG: Expected test file EXISTS on disk."
                
                # 🛑 FIX: Removed '-x' to prevent invisible whitespace/CRLF from breaking the match
                if echo "$PR_ADDED_FILES" | grep -Fq "$EXPECTED_TEST_FILE"; then
                  echo "✅ Source file modified AND its test was newly generated in this PR: $EXPECTED_TEST_FILE"
                  TESTS_TO_RUN="$TESTS_TO_RUN $EXPECTED_TEST_FILE"
                else
                  echo "⏭️ Source file modified, but its test ($EXPECTED_TEST_FILE) was NOT generated in this PR. Skipping."
                fi
              else
                 echo "⏭️ Expected test file ($EXPECTED_TEST_FILE) DOES NOT EXIST on disk. Skipping."
              fi
            fi
          done

          # Deduplicate the list
          FINAL_TESTS=$(echo "$TESTS_TO_RUN" | tr ' ' '\n' | sort -u | xargs)

          if [ -z "$FINAL_TESTS" ]; then
            echo "No eligible test files or new PR-generated tests were detected for this push."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "Detected eligible test files to run: $FINAL_TESTS"
            echo "test_files=$FINAL_TESTS" >> "$GITHUB_OUTPUT"
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.detect_tests.outputs.run_tests == 'true'
        run: |
          python3 -m pip install --upgrade pip --break-system-packages
          # Add any dependencies your calculator application requires here
          if [ -f requirements.txt ]; then pip3 install --break-system-packages -r requirements.txt; fi
          pip3 install --break-system-packages pytest pytest-cov "mutmut<3" # mutmut 3.x dropped the CLI flags this workflow relies on
          pip3 install --break-system-packages requests  # Ensures requests is available for Mocking API calls

      - name: Run Test Suite and Generate JUnit XML
        if: steps.detect_tests.outputs.run_tests == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          TARGET_TESTS: ${{ steps.detect_tests.outputs.test_files }}
        run: |
          echo "🚀 Executing pytest on: $TARGET_TESTS"
          # Run only the detected test files. '|| true' ensures we still parse results if tests fail.
          pytest $TARGET_TESTS --cov=NIC_SecEng_Task --cov-branch --cov-report=term --cov-report=xml:${{ github.workspace }}/coverage.xml --junitxml=${{ github.workspace }}/dynamic_test_report.xml -v || true

      - name: Run Mutation Testing
        if: steps.detect_tests.outputs.run_tests == 'true'
        env:
          TARGET_TESTS: ${{ steps.detect_tests.outputs.test_files }}
        run: |
          mkdir -p "${{ github.workspace }}/mutation_reports"
          for TEST_FILE in $TARGET_TESTS; do
            SOURCE_FILE=$(python3 Agentic_Unit_Test_Generator/scripts/resolve_source_file.py "$TEST_FILE")
            if [ -z "$SOURCE_FILE" ]; then
              echo "⏭️ No source file resolved for $TEST_FILE — skipping mutation testing."
              continue
            fi
            echo "🧬 Running mutmut on $SOURCE_FILE using $TEST_FILE"
            rm -rf .mutmut-cache
            mutmut run --paths-to-mutate "$SOURCE_FILE" --tests-dir Agentic_Unit_Test_Generator/tests \
              --runner "python3 -m pytest $TEST_FILE -x -q" || true
            mutmut junitxml > "${{ github.workspace }}/mutation_reports/$(basename "$SOURCE_FILE" .py).xml" || true
          done
          python3 Agentic_Unit_Test_Generator/scripts/log_mutation_survivors.py "${{ github.workspace }}/mutation_reports"

      - name: Parse Test Results
        if: always() && steps.detect_tests.outputs.run_tests == 'true'
        run: |
              if [ "${{ steps.detect_tests.outputs.run_tests }}" = "false" ]; then
                # Clean skip notice if no tests were touched
                echo "### No Test Execution Required" > pr_comment.md
                echo "This PR update did not contain new or modified test files inside the test suite directory." >> pr_comment.md
              elif [ -s "${{ github.workspace }}/dynamic_test_report.xml" ]; then
                echo "Parsing test, coverage, and mutation results..."
                python3 Agentic_Unit_Test_Generator/scripts/parse.py \
                  "${{ github.workspace }}/dynamic_test_report.xml" "python" "${{ github.workspace }}/coverage.xml" "${{ github.workspace }}/mutation_reports"
              else
                echo "No report found."
                echo "### ⏳ No test results yet" > pr_comment.md
                echo "The test suite did not produce a report. Check the run logs." >> pr_comment.md
              fi

      - name: Post Results to PR
        if: always() && steps.detect_tests.outputs.run_tests == 'true'
        uses: actions/github-script@v7
        with:
          script: |
                const fs = require('fs');
                const commentFile = 'pr_comment.md';

                if (!fs.existsSync(commentFile)) {
                  console.log('No pr_comment.md found — skipping comment.');
                  return;
                }

                const body = fs.readFileSync(commentFile, 'utf8');
                // DYNAMIC PR LOOKUP: Find open PRs containing this commit SHA
                const prList = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                              owner: context.repo.owner,
                              repo: context.repo.repo,
                              commit_sha: context.sha
                            });

                // Find an open PR that targets the develop branch
                const openPR = prList.data.find(pr => pr.state === 'open' && pr.base.ref === 'develop');

                if (!openPR) {
                // 🛠️ FALLBACK PATH: Write directly to the GitHub Actions Job Summary Page
                console.log('No active PR found. Printing metrics directly to the Action Summary console.');
              
                // Append to the special environment file GitHub uses to populate the dashboard summary
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Automated Unit Test Metrics\n\n${body}`);
                return;
                }

                const prNumber = openPR.number;
                console.log(`Found active PR #${prNumber}. Proceeding to post test results.`);

                const marker = '<!-- bot-unit-test-results -->';
                const markedBody = marker + '\n' + body;

                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                });

                const existing = comments.data.find(c => c.body.includes(marker));

                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: existing.id,
                  });
                  console.log('Updated existing comment.');
                }
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: markedBody,
                  });
                  console.log('Created new comment.');
                