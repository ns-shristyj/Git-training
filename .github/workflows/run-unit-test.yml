name: Run Automated Unit Tests

on:
  pull_request:
    branches: [develop]
    types: [synchronize]
    paths:
      - 'Agentic-Unit-Test-Generator/tests/**'

permissions:
  contents: read

jobs:
  run-tests:
    name: Execute Unit Tests
    runs-on: arc-default-basic-cheap-s-set
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if a test file already exists
        id: check_existing
        run: |
          if [ -f "Agentic-Unit-Test-Generator/tests/test_calculator.py" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Test file already exists — skipping generation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_existing.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_existing.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          # Add any dependencies your calculator application requires here
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest  # Ensures pytest is available to run the tests

      - name: Run Test Suite via Pytest
        if: steps.check_existing.outputs.exists == 'true' 
        run: |
          # Runs the specific test file generated by your Bedrock agent
          pytest Agentic-Unit-Test-Generator/tests/test_calculator.py -v